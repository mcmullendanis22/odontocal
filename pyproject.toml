[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odontocal"
version = "0.1.0"
description = "Modality-aware temperature scaling and selective referral for MLLM dental triage"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "MATS Dental Triage Authors" },
]
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "timm==0.9.16",
    "transformers==4.44.2",
    "accelerate==0.33.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.4.2",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "pyyaml==6.0.2",
    "pillow==10.4.0",
    "matplotlib==3.9.2",
    "tqdm==4.66.4",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
    "ruff==0.6.9",
    "black==24.8.0",
    "isort==5.13.2",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[project.scripts]
odc-train = "odontocal.entry.train:main"
odc-fit-calibration = "odontocal.entry.fit_calibration:main"
odc-evaluate = "odontocal.entry.evaluate:main"
odc-infer = "odontocal.entry.infer:main"
odc-export-onnx = "odontocal.entry.export_onnx:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odontocal = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["odontocal"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["odontocal"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src/odontocal"]

[[tool.mypy.overrides]]
module = ["timm.*", "transformers.*", "accelerate.*", "scipy.*", "sklearn.*", "matplotlib.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: end-to-end smoke that touches the CNN trainer",
    "regression: golden-output regression tests",
]
